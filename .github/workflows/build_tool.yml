name: Build Firmware Updater EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python (32-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x86

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          cd tools
          pyinstaller firmware_updater.py --onefile --name firmware_updater

      - name: Prepare artifacts
        run: |
          copy tools\dist\firmware_updater.exe firmware_updater-${{ github.ref_name }}.exe

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware_updater-${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
